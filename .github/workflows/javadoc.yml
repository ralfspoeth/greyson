name: Javadoc

# Publishes the API docs to GitHub Pages at
# https://ralfspoeth.github.io/greyson/
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Without that, the deploy step fails with "Pages site not found".

on:
  push:
    branches: [ master ]
    paths:
      - 'src/main/java/**'
      - 'pom.xml'
      - '.github/workflows/javadoc.yml'
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# actions/deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; queue instead. Don't cancel a running
# deploy — a half-finished Pages upload is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 'compile' is required, not incidental. maven-javadoc-plugin decides
      # whether a project is a named module by looking for a compiled
      # module-info.class under target/classes, not by reading module-info.java.
      # Run javadoc:javadoc straight after clean and that directory is empty, so
      # the plugin classifies this modular project as unnamed and fails with
      # "Creating an aggregated report for both named and unnamed modules is not
      # possible." Releases never hit this because package/install compile first.
      #
      # The build also needs the test sources on the snippet path (see the
      # maven-javadoc-plugin config in pom.xml): package-info.java pulls regions
      # out of GreysonWay, which lives under src/test/java.
      - name: Build javadoc
        run: mvn -B -ntp clean compile javadoc:javadoc

      # maven-javadoc-plugin has moved its default output directory between
      # versions (target/site/apidocs vs target/reports/apidocs), so locate it
      # rather than hard-coding a path that silently uploads nothing.
      - name: Locate apidocs
        id: apidocs
        run: |
          dir=$(find target -type d -name apidocs -print -quit)
          if [ -z "$dir" ] || [ ! -f "$dir/index.html" ]; then
            echo "No apidocs with an index.html found under target/" >&2
            find target -maxdepth 3 -type d >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.apidocs.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
